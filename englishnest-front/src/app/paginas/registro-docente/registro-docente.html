<h1>Registro de docente</h1>

@if (mensaje) {
  <div class="alerta-ok">{{ mensaje }}</div>
}

@if (error) {
  <div class="alerta-error">{{ error }}</div>
}

<form (ngSubmit)="enviar()" [formGroup]="formulario">
  <div class="campo">
    <label>Nombres</label>
    <input type="text" formControlName="nombres">
  </div>

  <div class="campo">
    <label>Apellidos</label>
    <input type="text" formControlName="apellidos">
  </div>

  <div class="campo">
    <label>Correo electrónico</label>
    <input type="email" formControlName="email">
  </div>

  <div class="campo">
    <label>Contraseña</label>
    <input type="password" formControlName="password">
  </div>

  <div class="campo">
    <label>Confirmar contraseña</label>
    <input type="password" formControlName="password_confirmation">
  </div>

  <div class="campo">
    <label>Estudios</label>
    <textarea rows="4" formControlName="estudios"></textarea>
  </div>

  <div class="campo">
    <label>Especialidad</label>
    <input type="text" formControlName="especialidad">
  </div>

  <div class="campo">
    <label>Biografía</label>
    <textarea rows="4" formControlName="biografia"></textarea>
  </div>

  <button class="boton" type="submit">Registrarme como docente</button>
</form>
